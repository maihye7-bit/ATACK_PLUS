name: SQL migration smoke test

on:
  push:
    branches:
      - repair/verified-fixes
  pull_request:
    branches:
      - main

jobs:
  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: atack_plus_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atack_plus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare minimal Supabase Auth compatibility layer
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid
          LANGUAGE sql STABLE
          AS $$ SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          CREATE FUNCTION auth.role() RETURNS text
          LANGUAGE sql STABLE
          AS $$ SELECT NULLIF(current_setting('request.jwt.claim.role', true), '') $$;
          SQL
      - name: Apply Phase 1 schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/POSTGRES_SCHEMA_PHASE1_FIXED.sql"
      - name: Apply Phase 2 business RPCs
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_PHASE2_BUSINESS_RPCS.sql"
      - name: Apply Phase 3 returns, inventory and accounting
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_PHASE3_RETURNS_INVENTORY_ACCOUNTING.sql"
      - name: Apply business return logic repairs
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_BUSINESS_RETURNS_REPAIR.sql"
      - name: Apply purchase receiving extensions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_PURCHASE_RECEIVING_EXTENSIONS.sql"
      - name: Apply purchase amendment RPC
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_PURCHASE_AMENDMENTS.sql"
      - name: Apply receipt-linked purchase return RPC
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_PURCHASE_RETURN_RECEIPT_LINK.sql"
      - name: Apply stock adjustment repair
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_STOCK_ADJUSTMENT_REPAIR.sql"
      - name: Apply business RPC lock-order repair
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_BUSINESS_OPERATION_LOCK_ORDER_REPAIR.sql"
      - name: Apply Phase 3 security hardening
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_PHASE3_SECURITY_HARDENING.sql"
      - name: Apply Phase 3 accounting hardening
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_PHASE3_ACCOUNTING_HARDENING.sql"
      - name: Run Phase 2 business regression tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase2-business-regression.sql"
      - name: Run authenticated business RPC regression
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-authenticated-business-rpc-regression.sql"
      - name: Run concurrent purchase regression
        env:
          PGPASSWORD: postgres
        run: bash tests/phase2-concurrency.sh
      # Exercises synchronized concurrent returns and stock-adjustment accounting (latest fixture IDs).
      - name: Run concurrent returns and stock adjustment regression
        env:
          PGPASSWORD: postgres
        run: bash tests/phase3-concurrency-returns-adjustments.sh
      - name: Run Phase 3 security regression tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-security-regression.sql"
      - name: Run Phase 3 accounting regression tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-accounting-regression.sql"
      - name: Apply Phase 3 sync hardening
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_PHASE3_SYNC_HARDENING.sql"
      - name: Run Phase 3 sync regression tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-sync-regression.sql"
      - name: Apply Phase 3 sync Push hardening
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_PHASE3_SYNC_PUSH_HARDENING.sql"
      - name: Run Phase 3 sync Push regression tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-sync-push-regression.sql"
      - name: Run authenticated Push and Outbox regression
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-authenticated-sync-push-regression.sql"
      - name: Apply Phase 3 audit security hardening
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_PHASE3_AUDIT_SECURITY_HARDENING.sql"
      - name: Run Phase 3 audit security regression tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-audit-security-regression.sql"
      - name: Apply Phase 3 audit event coverage
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_PHASE3_AUDIT_EVENT_COVERAGE.sql"
      - name: Run Phase 3 audit event regression tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-audit-event-regression.sql"
      - name: Apply Phase 3 user-role and device security
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_PHASE3_USER_ROLE_DEVICE_SECURITY.sql"
      - name: Run Phase 3 user-role and device regressions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-user-role-device-regression.sql"
      - name: Apply Phase 3 user account security
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_PHASE3_USER_ACCOUNT_SECURITY.sql"
      - name: Run Phase 3 user account security regressions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-user-account-security-regression.sql"
      - name: Apply complete security catalog hardening
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_PHASE3_SECURITY_CATALOG_HARDENING.sql"
      - name: Run complete security catalog regression
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-security-catalog-regression.sql"
      - name: Apply Phase 3 RBAC read hardening
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_PHASE3_RBAC_READ_HARDENING.sql"
      - name: Run Phase 3 RBAC read regression tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-rbac-read-regression.sql"
      - name: Run explicit owner/seller/accountant/stock-keeper role matrix regression
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-rbac-role-matrix-regression.sql"
      - name: Verify repaired SQL contracts
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='purchase_return_items'
                AND column_name='quantity_unit_id'
            ) THEN RAISE EXCEPTION 'purchase_return_items.quantity_unit_id missing'; END IF;
            IF EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='purchase_return_items'
                AND column_name='unit_id'
            ) THEN RAISE EXCEPTION 'Unexpected purchase_return_items.unit_id column'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
              WHERE n.nspname='public' AND p.proname='trg_log_change'
            ) THEN RAISE EXCEPTION 'trg_log_change missing'; END IF;
          END $$;
          SQL
