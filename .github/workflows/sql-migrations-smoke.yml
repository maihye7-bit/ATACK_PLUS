name: SQL migration smoke test

on:
  push:
    branches:
      - repair/verified-fixes
  pull_request:
    branches:
      - main

jobs:
  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: atack_plus_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atack_plus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare minimal Supabase Auth compatibility layer
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid
          LANGUAGE sql STABLE
          AS $$ SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          CREATE FUNCTION auth.role() RETURNS text
          LANGUAGE sql STABLE
          AS $$ SELECT NULLIF(current_setting('request.jwt.claim.role', true), '') $$;
          SQL
      - name: Apply Phase 1 schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/POSTGRES_SCHEMA_PHASE1_FIXED.sql"
      - name: Apply Phase 2 business RPCs
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_PHASE2_BUSINESS_RPCS.sql"
      - name: Apply Phase 3 returns, inventory and accounting
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_PHASE3_RETURNS_INVENTORY_ACCOUNTING.sql"
      - name: Apply business return logic repairs
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_BUSINESS_RETURNS_REPAIR.sql"
      - name: Apply purchase receiving extensions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_PURCHASE_RECEIVING_EXTENSIONS.sql"
      - name: Apply purchase amendment RPC
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_PURCHASE_AMENDMENTS.sql"
      - name: Apply receipt-linked purchase return RPC
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_PURCHASE_RETURN_RECEIPT_LINK.sql"
      - name: Apply stock adjustment repair
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_STOCK_ADJUSTMENT_REPAIR.sql"
      - name: Seed legacy inventory rows for store-scoped warehouse migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-warehouse-legacy-fixture.sql"
      - name: Apply Stage 3 store-scoped warehouse migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/PHASE3_REPAIR_010_STORE_SCOPED_WAREHOUSES.sql"
      - name: Apply Stage 3 negative-stock audit migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/PHASE3_REPAIR_011_NEGATIVE_STOCK_AUDIT.sql"
      - name: Run Stage 3 store-scoped warehouse regression
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-warehouse-store-scope-regression.sql"
      - name: Apply Phase 1 same-store integrity repair
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/PHASE1_REPAIR_001_SAME_STORE_INTEGRITY.sql"
      - name: Apply Phase 1 extension same-store integrity repair
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/PHASE1_REPAIR_002_EXTENSION_SAME_STORE.sql"
      - name: Apply Phase 1 sync and audit same-store integrity repair
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/PHASE1_REPAIR_003_SYNC_AUDIT_SAME_STORE.sql"
      - name: Run Phase 1 same-store integrity regression
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase1-same-store-integrity-regression.sql"
      - name: Run Phase 1 extension same-store integrity regression
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase1-extension-same-store-regression.sql"
      - name: Run Phase 1 sync and audit same-store regression
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase1-sync-audit-same-store-regression.sql"
      - name: Run same-store parent-child concurrency regression
        env:
          PGPASSWORD: postgres
        run: bash tests/phase1-same-store-concurrency.sh
      - name: Apply business RPC lock-order repair
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_BUSINESS_OPERATION_LOCK_ORDER_REPAIR.sql"
      - name: Apply Phase 3 security hardening
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_PHASE3_SECURITY_HARDENING.sql"
      - name: Apply Phase 3 accounting hardening
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_PHASE3_ACCOUNTING_HARDENING.sql"
      - name: Run Phase 2 business regression tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase2-business-regression.sql"
      - name: Run authenticated business RPC regression
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-authenticated-business-rpc-regression.sql"
      - name: Run concurrent purchase regression
        env:
          PGPASSWORD: postgres
        run: bash tests/phase2-concurrency.sh
      # Exercises synchronized concurrent returns and stock-adjustment accounting (latest fixture IDs).
      - name: Run concurrent returns and stock adjustment regression
        env:
          PGPASSWORD: postgres
        run: bash tests/phase3-concurrency-returns-adjustments.sh
      - name: Run Phase 3 security regression tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-security-regression.sql"
      - name: Run Phase 3 accounting regression tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-accounting-regression.sql"
      - name: Apply Phase 3 sync hardening
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_PHASE3_SYNC_HARDENING.sql"
      - name: Run Phase 3 sync regression tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-sync-regression.sql"
      - name: Apply Phase 3 sync Push hardening
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_PHASE3_SYNC_PUSH_HARDENING.sql"
      - name: Run Phase 3 sync Push regression tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-sync-push-regression.sql"
      - name: Run authenticated Push and Outbox regression
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-authenticated-sync-push-regression.sql"
      - name: Apply Phase 3 audit security hardening
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_PHASE3_AUDIT_SECURITY_HARDENING.sql"
      - name: Run Phase 3 audit security regression tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-audit-security-regression.sql"
      - name: Apply Phase 3 audit event coverage
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_PHASE3_AUDIT_EVENT_COVERAGE.sql"
      - name: Run Phase 3 audit event regression tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-audit-event-regression.sql"
      - name: Run concurrent soft-delete regression
        env:
          PGPASSWORD: postgres
        run: bash tests/phase2-soft-delete-concurrency.sh
      - name: Apply Phase 3 user-role and device security
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_PHASE3_USER_ROLE_DEVICE_SECURITY.sql"
      - name: Run Phase 3 user-role and device regressions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-user-role-device-regression.sql"
      - name: Apply Phase 3 user account security
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_PHASE3_USER_ACCOUNT_SECURITY.sql"
      - name: Run Phase 3 user account security regressions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-user-account-security-regression.sql"
      - name: Apply complete security catalog hardening
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_PHASE3_SECURITY_CATALOG_HARDENING.sql"
      - name: Run complete security catalog regression
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-security-catalog-regression.sql"
      - name: Apply Phase 3 RBAC read hardening
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_PHASE3_RBAC_READ_HARDENING.sql"
      - name: Run Phase 3 RBAC read regression tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-rbac-read-regression.sql"
      - name: Apply owner/seller role consolidation
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/ATACK_PLUS_PHASE3_OWNER_SELLER_ROLE_CONSOLIDATION.sql"
      - name: Run owner/seller role matrix regression
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-rbac-role-matrix-regression.sql"
      - name: Run offline SQLite owner/seller role migration regression
        run: python tests/sqlite-owner-seller-role-regression.py

      # Stage 2: SQLite history FKs must match PostgreSQL retention semantics.
      - name: Run SQLite Stage 2 history-retention regression
        run: python tests/sqlite-stage2-history-retention-regression.py

      # Stage 3 / Part A: existing offline databases must migrate warehouse IDs per store.
      - name: Run SQLite Stage 3 warehouse migration regression
        run: python tests/sqlite-stage3-warehouse-migration-regression.py

      # D3.2 / R1: SECURITY DEFINER Pull must enforce the same owner/seller visibility
      # contract as direct table reads. This runs only in the disposable PostgreSQL CI service.
      - name: Apply D3.2 Pull RBAC hardening
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/PHASE3_REPAIR_005_SYNC_PULL_RBAC.sql"
      - name: Run D3.2 Pull RBAC regression
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-sync-pull-rbac-regression.sql"

      # D3.2 / R2: authenticate the assigned device for every authenticated sync RPC.
      - name: Apply D3.2 device credential binding
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/PHASE3_REPAIR_006_DEVICE_CREDENTIAL_BINDING.sql"
      - name: Run D3.2 device credential regression
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-device-credential-regression.sql"

      # D-016: negative stock sale and adjustment require permission, reason,
      # operation evidence and a registered device credential. Run after R2.
      - name: Run Stage 3 negative-stock policy regression
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-negative-stock-policy-regression.sql"

      # D3.2 / R3: a cursor can be acknowledged only through a server-issued page record.
      - name: Apply D3.2 delivery-bound ACK
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/PHASE3_REPAIR_007_SYNC_DELIVERY_ACK.sql"
      - name: Run D3.2 delivery and pagination regression
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-sync-delivery-ack-regression.sql"

      # D3.2 / R4: expose Tombstone INSERT as the canonical logical DELETE envelope.
      - name: Apply D3.2 Tombstone event contract
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/PHASE3_REPAIR_008_TOMBSTONE_EVENT_CONTRACT.sql"
      - name: Run D3.2 Tombstone event contract regression
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-tombstone-event-contract-regression.sql"

      # D3.2 / R5: retain legacy global Tombstone fields but use per-device ACK state.
      - name: Apply D3.2 Tombstone sync-state semantics
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/PHASE3_REPAIR_009_TOMBSTONE_SYNC_STATE_SEMANTICS.sql"
      - name: Run D3.2 per-device Tombstone progress regression
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-tombstone-device-progress-regression.sql"

      # D3.2 / R6: exact page boundaries and concurrent Change Log writes.
      - name: Run D3.2 pagination boundary regression
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase3-sync-pagination-boundary-regression.sql"
      - name: Run D3.2 concurrent page delivery regression
        env:
          PGPASSWORD: postgres
        run: bash tests/phase3-sync-page-concurrency.sh
      - name: Verify repaired SQL contracts
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='purchase_return_items'
                AND column_name='quantity_unit_id'
            ) THEN RAISE EXCEPTION 'purchase_return_items.quantity_unit_id missing'; END IF;
            IF EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='purchase_return_items'
                AND column_name='unit_id'
            ) THEN RAISE EXCEPTION 'Unexpected purchase_return_items.unit_id column'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
              WHERE n.nspname='public' AND p.proname='trg_log_change'
            ) THEN RAISE EXCEPTION 'trg_log_change missing'; END IF;
          END $$;
          SQL

      # Read-only Stage 2 / Part 3-D1 FK catalog and data-integrity preflight.
      # Runs only against this workflow's disposable PostgreSQL 16 service.
      - name: Run Stage 2 FK catalog preflight (read-only)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase2-fk-catalog-preflight.sql"

      # Stage 2 / Part 3-D2: change only the approved 16 business-history FK actions.
      # This migration is applied solely to the disposable PostgreSQL CI service.
      - name: Apply Stage 2 FK history protection migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "docs/PHASE2_REPAIR_004_FK_HISTORY_RESTRICT.sql"

      - name: Run Stage 2 FK cascade remediation regression
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase2-fk-cascade-remediation-regression.sql"

      # Stage 2 / Part 3-D3.1: Change Log ownership and atomic child-delete coverage.
      - name: Run Stage 2 Change Log child-delete regression
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d atack_plus_test -v ON_ERROR_STOP=1 -f "tests/phase2-change-log-child-delete-regression.sql"
