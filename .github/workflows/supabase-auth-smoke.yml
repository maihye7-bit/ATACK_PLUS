name: Supabase Auth integration smoke test

on:
  push:
    branches:
      - repair/verified-fixes
  pull_request:
    branches:
      - main

jobs:
  supabase-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.4.0

      - name: Start local Supabase stack
        run: supabase start -x studio,edge-runtime,logflare,vector,imgproxy

      - name: Export local Supabase connection settings
        shell: bash
        run: |
          set -a
          eval "$(supabase status -o env)"
          set +a
          {
            echo "API_URL=$API_URL"
            echo "DB_URL=$DB_URL"
            echo "ANON_KEY=$ANON_KEY"
          } >> "$GITHUB_ENV"

      - name: Apply ATACK PLUS SQL to Supabase PostgreSQL
        run: |
          set -euo pipefail
          apply_sql() {
            echo "Applying $1"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$1"
          }
          apply_sql docs/POSTGRES_SCHEMA_PHASE1_FIXED.sql
          apply_sql docs/ATACK_PLUS_PHASE2_BUSINESS_RPCS.sql
          apply_sql docs/ATACK_PLUS_PHASE3_RETURNS_INVENTORY_ACCOUNTING.sql
          apply_sql docs/ATACK_PLUS_BUSINESS_RETURNS_REPAIR.sql
          apply_sql docs/ATACK_PLUS_PURCHASE_RECEIVING_EXTENSIONS.sql
          apply_sql docs/ATACK_PLUS_PURCHASE_AMENDMENTS.sql
          apply_sql docs/ATACK_PLUS_PURCHASE_RETURN_RECEIPT_LINK.sql
          apply_sql docs/ATACK_PLUS_STOCK_ADJUSTMENT_REPAIR.sql
          apply_sql docs/ATACK_PLUS_BUSINESS_OPERATION_LOCK_ORDER_REPAIR.sql
          apply_sql docs/ATACK_PLUS_PHASE3_SECURITY_HARDENING.sql
          apply_sql docs/ATACK_PLUS_PHASE3_ACCOUNTING_HARDENING.sql
          apply_sql docs/ATACK_PLUS_PHASE3_SYNC_HARDENING.sql
          apply_sql docs/ATACK_PLUS_PHASE3_SYNC_PUSH_HARDENING.sql
          apply_sql docs/ATACK_PLUS_PHASE3_AUDIT_SECURITY_HARDENING.sql
          apply_sql docs/ATACK_PLUS_PHASE3_AUDIT_EVENT_COVERAGE.sql
          apply_sql docs/ATACK_PLUS_PHASE3_USER_ROLE_DEVICE_SECURITY.sql
          apply_sql docs/ATACK_PLUS_PHASE3_USER_ACCOUNT_SECURITY.sql
          apply_sql docs/ATACK_PLUS_PHASE3_SECURITY_CATALOG_HARDENING.sql
          apply_sql docs/ATACK_PLUS_PHASE3_RBAC_READ_HARDENING.sql

      - name: Run real Auth and PostgREST integration smoke test
        run: bash tests/supabase-auth-smoke.sh
